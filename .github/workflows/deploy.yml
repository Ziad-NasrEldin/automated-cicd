name: Reusable branch CI and deployment

on:
  workflow_call:
    inputs:
      provider:
        description: vercel, coolify, vps, or github
        required: true
        type: string
      environment:
        description: Target GitHub environment
        required: true
        type: string
      production-branch:
        required: true
        type: string
      staging-branch:
        required: false
        default: ""
        type: string
      require-tested-staging:
        required: false
        default: false
        type: boolean
      caller-workflow-file:
        required: true
        type: string
      node-version:
        required: false
        default: "22"
        type: string
      install-command:
        required: false
        default: npm ci
        type: string
      validation-command:
        required: true
        type: string
      healthcheck-url:
        required: false
        default: ""
        type: string
      coolify-api-base:
        required: false
        default: ""
        type: string
      vercel-cli-version:
        required: false
        default: "55.0.0"
        type: string
      vps-deploy-script:
        required: false
        default: scripts/deploy.sh
        type: string
      vps-revision-command:
        required: false
        default: ""
        type: string
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      COOLIFY_TOKEN:
        required: false
      COOLIFY_WEBHOOK:
        required: false
      VPS_HOST:
        required: false
      VPS_USER:
        required: false
      VPS_SSH_KEY:
        required: false
      VPS_KNOWN_HOSTS:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validate revision
    if: github.ref_name == inputs.production-branch || github.ref_name == inputs.staging-branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate workflow inputs
        env:
          PROVIDER: ${{ inputs.provider }}
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          STAGING_BRANCH: ${{ inputs.staging-branch }}
          REQUIRE_TESTED_STAGING: ${{ inputs.require-tested-staging }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck-url }}
          VPS_REVISION_COMMAND: ${{ inputs.vps-revision-command }}
        run: |
          case "$PROVIDER" in
            vercel|coolify|vps|github) ;;
            *) echo "Unsupported provider: $PROVIDER" >&2; exit 1 ;;
          esac
          test -n "$ENVIRONMENT_NAME"
          test -n "$PRODUCTION_BRANCH"
          if [ "$REQUIRE_TESTED_STAGING" = "true" ]; then
            test -n "$STAGING_BRANCH"
          fi
          if [ "$PROVIDER" = "vps" ]; then
            test -n "$HEALTHCHECK_URL"
            test -n "$VPS_REVISION_COMMAND"
          fi

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Verify production came from tested staging
        if: inputs.require-tested-staging && github.ref_name == inputs.production-branch
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BRANCH: ${{ inputs.staging-branch }}
          CALLER_WORKFLOW_FILE: ${{ inputs.caller-workflow-file }}
        run: |
          git fetch origin "$STAGING_BRANCH"
          git merge-base --is-ancestor "origin/$STAGING_BRANCH" HEAD
          git diff --quiet "origin/$STAGING_BRANCH" HEAD
          staging_sha=$(git rev-parse "origin/$STAGING_BRANCH")
          response=$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$CALLER_WORKFLOW_FILE/runs?branch=$STAGING_BRANCH&status=success&per_page=100" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28")
          jq --exit-status --arg sha "$staging_sha" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            <<< "$response" > /dev/null

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Run validation
        env:
          VALIDATION_COMMAND: ${{ inputs.validation-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

  deploy:
    name: Deploy ${{ inputs.provider }} to ${{ inputs.environment }}
    needs: validate
    if: inputs.provider != 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        if: inputs.provider == 'vercel' || inputs.provider == 'vps'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node.js for Vercel
        if: inputs.provider == 'vercel'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ inputs.node-version }}

      - name: Deploy Vercel artifact
        if: inputs.provider == 'vercel'
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: ${{ inputs.vercel-cli-version }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel pull --yes --environment="$([[ '${{ inputs.environment }}' == 'production' ]] && echo production || echo preview)" --token="$VERCEL_TOKEN"
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
            deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
              --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef="$GITHUB_REF_NAME")
          else
            vercel build --token="$VERCEL_TOKEN"
            deployment_url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
              --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef="$GITHUB_REF_NAME")
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel deployment revision
        if: inputs.provider == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
        run: |
          deployment_host=${DEPLOYMENT_URL#https://}
          response=$(curl --fail-with-body --silent --show-error \
            --url "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN")
          test "$(jq --raw-output '.readyState // empty' <<< "$response")" = "READY"
          test "$(jq --raw-output '.meta.githubCommitSha // empty' <<< "$response")" = "$GITHUB_SHA"
          curl --fail --silent --show-error "$DEPLOYMENT_URL" > /dev/null

      - name: Trigger Coolify deployment
        if: inputs.provider == 'coolify'
        id: coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_WEBHOOK"
          response=$(curl --fail-with-body --silent --show-error \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")
          deployment_uuid=$(jq --raw-output '.deployments[0].deployment_uuid // .deployment_uuid // empty' <<< "$response")
          test -n "$deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deployment
        if: inputs.provider == 'coolify'
        env:
          COOLIFY_API_BASE: ${{ inputs.coolify-api-base }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.coolify.outputs.deployment_uuid }}
        run: |
          test -n "$COOLIFY_API_BASE"
          for _ in $(seq 1 120); do
            response=$(curl --fail-with-body --silent --show-error \
              "${COOLIFY_API_BASE%/}/deployments/$DEPLOYMENT_UUID" \
              --header "Authorization: Bearer $COOLIFY_TOKEN")
            status=$(jq --raw-output '.status // empty' <<< "$response")
            if [ "$status" = "finished" ]; then
              deployed_sha=$(jq --raw-output '.commit // .git_commit_sha // empty' <<< "$response")
              test -n "$deployed_sha"
              case "$GITHUB_SHA" in
                "$deployed_sha"*) exit 0 ;;
                *) echo "Coolify deployed a different revision: $deployed_sha" >&2; exit 1 ;;
              esac
            fi
            if [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then
              echo "Coolify deployment ended with status: $status" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Coolify deployment timed out." >&2
          exit 1

      - name: Configure VPS SSH
        if: inputs.provider == 'vps'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy to raw VPS
        if: inputs.provider == 'vps'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SCRIPT: ${{ inputs.vps-deploy-script }}
          REVISION_COMMAND: ${{ inputs.vps-revision-command }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -f "$DEPLOY_SCRIPT"
          # shellcheck disable=SC2029
          ssh "$VPS_USER@$VPS_HOST" "DEPLOY_SHA='$GITHUB_SHA' bash -s" < "$DEPLOY_SCRIPT"
          if [ -n "$REVISION_COMMAND" ]; then
            # shellcheck disable=SC2029
            deployed_sha=$(ssh "$VPS_USER@$VPS_HOST" "$REVISION_COMMAND")
            test "$deployed_sha" = "$GITHUB_SHA"
          fi

      - name: Verify public health
        if: inputs.healthcheck-url != ''
        env:
          HEALTHCHECK_URL: ${{ inputs.healthcheck-url }}
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check did not pass." >&2
          exit 1
